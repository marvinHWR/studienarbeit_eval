# Small smoke-test run for PubMedQA: 10 questions x 3 arms x 1 sample = 30 rows.
# Purpose: verify the full pipeline (generation -> scoring -> parquet + Excel) works
# end-to-end before committing to a larger/paid run.
seed: 42

generator:
  model: "gemini/gemini-3.5-flash-lite"   # 3.5-flash (non-lite) was Google-side capacity-throttled
  temperature: 0.2
  max_tokens: 2048          # room for any hidden reasoning tokens + the full visible answer
  n_samples: 1

judge:
  model: "anthropic/claude-sonnet-5"
  temperature: 0.0
  max_tokens: 512

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"

retrieval:
  k: 4
  chunk_level: "paragraph"

kb_size_sweep: [4]   # unused with --no-sweep, kept for schema completeness

experiment:
  dataset: "pubmedqa"
  n_questions: 10
  arms: ["no_context", "full_context", "rag"]

paths:
  results_dir: "results"
